# Family API test site: https://global.mytendi.com:8443/docs  ->  API on 127.0.0.1:3100 (pm2: tendi-family-api).
#
# 8443 because global.mytendi.com is behind Cloudflare, which forwards HTTPS only on 443, 2053, 2083, 2087, 2096
# and 8443. The certificate is the one the Tendi-Global site already uses (it is valid on any port).
#
# Install (replace both placeholders; never commit the filled-in copy):
#   GATE=$(openssl rand -hex 32)
#   printf 'admin:%s\n' "$(openssl passwd -apr1 '<password>')" > /etc/nginx/tendi-family-api-test.htpasswd
#   chown root:www-data /etc/nginx/tendi-family-api-test.htpasswd && chmod 640 /etc/nginx/tendi-family-api-test.htpasswd
#   sed "s/__GATE_SECRET__/$GATE/g" deploy/nginx-family-api-test.conf > /etc/nginx/sites-available/tendi-family-api-test
#   ln -sfn /etc/nginx/sites-available/tendi-family-api-test /etc/nginx/sites-enabled/tendi-family-api-test
#   nginx -t && systemctl reload nginx
#   ufw allow 8443/tcp comment 'tendi family API test (HTTPS, password)'
#
# Why a cookie as well as the password: Swagger's "Try it out" sends its own Authorization: Bearer <staff token>,
# so the browser's basic-auth header cannot ride along on API calls. Signing in on /docs sets an HttpOnly cookie
# holding a random secret, and /api/ accepts that cookie. Without it /api/ falls back to the username/password
# (for curl -u), and the Basic header is stripped before the API sees it.

limit_req_zone $binary_remote_addr zone=tendi_family_test:10m rate=300r/m;

server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name global.mytendi.com _;

    ssl_certificate     /etc/letsencrypt/live/global.mytendi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/global.mytendi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/tendi-family-api-test.access.log;
    client_max_body_size 2m;
    limit_req zone=tendi_family_test burst=100 nodelay;
    limit_req_status 429;

    # A location with its own add_header drops these, so each location repeats them.
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = / {
        auth_basic           "Tendi Family API test";
        auth_basic_user_file /etc/nginx/tendi-family-api-test.htpasswd;
        return 302 /docs/;
    }

    # Swagger UI and the OpenAPI document. Signing in here sets the gate cookie for /api/.
    location /docs {
        auth_basic           "Tendi Family API test";
        auth_basic_user_file /etc/nginx/tendi-family-api-test.htpasswd;
        add_header Set-Cookie "tendi_family_gate=__GATE_SECRET__; Path=/; Max-Age=43200; Secure; HttpOnly; SameSite=Strict" always;
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The API. With the gate cookie: passed through with the request's own Authorization (the staff Bearer token).
    location /api/ {
        error_page 418 = @api_with_password;
        # Compared here, not in a map: a 64-character map key overflows nginx's default map_hash_bucket_size.
        if ($cookie_tendi_family_gate != "__GATE_SECRET__") {
            return 418;
        }
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Without the cookie: the username/password, and the API then sees no token.
    location @api_with_password {
        auth_basic           "Tendi Family API test";
        auth_basic_user_file /etc/nginx/tendi-family-api-test.htpasswd;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
